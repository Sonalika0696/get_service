services:
  postgres:
    image: postgres:16-alpine
    container_name: society_fintech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: society_fintech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    image: maildev/maildev
    container_name: society_fintech_maildev
    restart: unless-stopped
    ports:
      - "1080:1080" # web UI
      - "1025:1025" # SMTP

volumes:
  postgres_data:
